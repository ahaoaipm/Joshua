<script>
(() => {
'use strict';
const W = 1080, H = 1920;
const EXPORT = !!window.__ENFJ_EXPORT__;
if (EXPORT) document.body.classList.add('export');

/* ---------- utils ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: p => 1 - Math.pow(1 - p, 3),

const win = (t, a, b, fi = .3, fo = .3) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mix(c1, c2, p) { const a = hex(c1), b = hex(c2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], clamp(p))).toString(16).padStart(2, '0')).join(''); }
const shade = (c, k) => k >= 0 ? mix(c, '#ffffff', k) : mix(c, '#000000', -k);
const TAU = Math.PI * 2;

const FD = '"Noto Serif SC", "Noto Sans SC", serif';
const FB = '"Noto Sans SC", "Noto Serif SC", sans-serif';
const usedText = new Set();

/* One muted palette for every scene: sage diplomat greens, paper neutrals, dusty secondaries. */
const C = {
  green: '#6F8C5B', greenD: '#4E6842', sun: '#E3C56E', lime: '#CDD574', skin: '#DDB999', ink: '#2C3530', inkSoft: '#5D6760',
  hair: '#4A4A4D', pants: '#3E4943', paper: '#F3EFE7', collar: '#6AAE95', belt: '#AEC47E',
  blue: '#6E8DAE', coral: '#C47A5E', purple: '#977CA4', orange: '#CFA552', teal: '#5D8F8C', pink: '#C68C93', grey: '#9BA19C', rose: '#CF8A90',
};

/* ---------- primitives ---------- */
function poly(ctx, pts, fill) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function circle(ctx, x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function hexa(ctx, x, y, r, fill, fillD) { const pts = []; for (let i = 0; i < 6; i++) { const a = i * TAU / 6 + Math.PI / 6; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } poly(ctx, pts, fill); if (fillD) poly(ctx, [[x, y - r], pts[5], pts[0], pts[1], [x, y + r]], fillD); }
function limb(ctx, x1, y1, x2, y2, w1, w2, cl, cd) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const a = [x1 + nx * w1 / 2, y1 + ny * w1 / 2], b = [x2 + nx * w2 / 2, y2 + ny * w2 / 2], c = [x2 - nx * w2 / 2, y2 - ny * w2 / 2], d = [x1 - nx * w1 / 2, y1 - ny * w1 / 2];
  poly(ctx, [a, b, [x2, y2], [x1, y1]], cl); poly(ctx, [[x1, y1], [x2, y2], c, d], cd);
}
function grad(ctx, y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function sky(ctx, top, bottom) { ctx.fillStyle = grad(ctx, 0, H, [top, bottom]); ctx.fillRect(0, 0, W, H); }
function ground(ctx, y, c1, c2) {
  ctx.fillStyle = grad(ctx, y, H, [c1, c2]); ctx.fillRect(0, y, W, H - y);
  const R = rng(Math.round(y)); ctx.save(); ctx.globalAlpha = .5;
  for (let x = -60; x < W + 60; x += 120) { const j = (R() - .5) * 40; poly(ctx, [[x, y], [x + 120, y], [x + 60 + j, y + 70 + R() * 40]], shade(c1, (R() - .5) * .06)); }
  ctx.restore();
  ctx.fillStyle = shade(c1, -.08); ctx.fillRect(0, y, W, 3);
}
function hills(ctx, y, color, seed, amp = 160, n = 5) {
  const R = rng(seed); const step = W / (n - 1);
  for (let i = -1; i < n; i++) { const x = i * step + (R() - .5) * 60, h = amp * (.5 + R() * .6), wd = step * (.75 + R() * .3);
    poly(ctx, [[x - wd, y + 4], [x, y - h], [x, y + 4]], shade(color, .05)); poly(ctx, [[x, y - h], [x + wd, y + 4], [x, y + 4]], shade(color, -.06)); }
}
function text(ctx, s, x, y, o = {}) {
  usedText.add(s);
  const size = o.size || 48;
  ctx.font = `${o.weight || ''} ${size}px ${o.font || FD}`.trim();
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.letterSpacing = o.ls ? o.ls + 'px' : '0px';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || size * 0.18; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }

  ctx.letterSpacing = '0px';
}
function heart(ctx, x, y, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(size / 100, size / 100);
  poly(ctx, [[0, 34], [-50, -12], [-46, -40], [-24, -52], [0, -30]], shade(color, .1));
  poly(ctx, [[0, 34], [0, -30], [24, -52], [46, -40], [50, -12]], shade(color, -.08));
  poly(ctx, [[-46, -40], [-24, -52], [-30, -28]], shade(color, .28));
  ctx.restore();
}
function sparkle(ctx, x, y, r, color, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot * .2); poly(ctx, [[0, -r], [r * .22, -r * .22], [r, 0], [r * .22, r * .22], [0, r], [-r * .22, r * .22], [-r, 0], [-r * .22, -r * .22]], color); ctx.restore();
}
function glow(ctx, x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); const [R, G, B] = hex(color);
  g.addColorStop(0, `rgba(${R},${G},${B},${0.6 * a})`); g.addColorStop(.5, `rgba(${R},${G},${B},${0.22 * a})`); g.addColorStop(1, `rgba(${R},${G},${B},0)`);

}
function cloud(ctx, x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const c = color.length > 7 ? color.slice(0, 7) : color; const a = color.length > 7 ? parseInt(color.slice(7), 16) / 255 : 1; ctx.globalAlpha *= a;
  poly(ctx, [[-130, 40], [-90, -10], [-40, -20], [0, -60], [60, -40], [90, 0], [130, 40]], c);
  poly(ctx, [[0, -60], [60, -40], [90, 0], [130, 40], [10, 40]], shade(c, -.06));
  ctx.restore();
}
function sunDisc(ctx, x, y, r, t, rays = true) {
  glow(ctx, x, y, r * 2.2, C.sun, .55);
  if (rays) { ctx.save(); ctx.translate(x, y); ctx.rotate(t * .08); ctx.strokeStyle = 'rgba(227,197,110,0.45)'; ctx.lineWidth = 3; for (let i = 0; i < 24; i++) { ctx.rotate(TAU / 24); ctx.beginPath(); ctx.moveTo(r * 1.18, 0); ctx.lineTo(r * (i % 2 ? 1.4 : 1.6), 0); ctx.stroke(); } ctx.restore(); }
  circle(ctx, x, y, r, '#E8CB78'); ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip(); poly(ctx, [[x + r * .1, y - r], [x + r, y - r], [x + r, y + r], [x - r * .2, y + r]], '#DDBC64'); ctx.restore();
}
function stars(ctx, t, n, seed, alpha = 1, yMax = 1100) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) { const x = R() * W, y = R() * yMax, ph = R() * TAU, sz = 2 + R() * 4; ctx.globalAlpha = alpha * (.4 + .6 * Math.sin(t * 1.6 + ph) ** 2); sparkle(ctx, x, y, sz * 1.4, '#F1EAD0'); }

}
function rain(ctx, t, amount, seed = 3) {
  if (amount <= 0) return;
  const R = rng(seed); ctx.strokeStyle = `rgba(214,224,236,${.45 * amount})`; ctx.lineWidth = 3; ctx.lineCap = 'butt';
  for (let i = 0; i < 90 * amount; i++) { const x0 = R() * (W + 200), sp = 1400 + R() * 500, off = R() * H; const y = (off + t * sp) % (H + 200) - 100; const x = (x0 - y * .18) % (W + 200); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 50); ctx.stroke(); }
}
function confetti(ctx, t, seed, p) {
  if (p <= 0) return; const R = rng(seed); const cols = [C.sun, C.coral, C.blue, C.green, C.pink, C.lime];
  for (let i = 0; i < 60; i++) { const x = R() * W, sp = 240 + R() * 240, y = -60 + ((R() * 900 + t * sp) % 1500), rot = t * (2 + R() * 3); ctx.save(); ctx.globalAlpha = p; ctx.translate(x + Math.sin(t * 2 + i) * 30, y); ctx.rotate(rot); poly(ctx, [[-10, -6], [10, -8], [6, 8]], cols[i % cols.length]); ctx.restore(); }
}
function floatingHearts(ctx, t, x, y, start, n = 6, color = C.rose, spread = 160) {
  for (let i = 0; i < n; i++) { const st = start + i * .35, p = (t - st) / 2.2; if (p <= 0 || p >= 1) continue; const hx = x + Math.sin(i * 2.3) * spread * .5 + Math.sin(p * 6 + i) * 18, hy = y - p * 300; ctx.globalAlpha = Math.sin(p * Math.PI); heart(ctx, hx, hy, 30 + (i % 3) * 10, color); }

}
function tree(ctx, x, y, s, c = '#7FA06A') {
  limb(ctx, x, y, x, y - 130 * s, 26 * s, 18 * s, '#8E6B4E', '#715440');
  const cy = y - 200 * s, r = 95 * s;
  const pts = [[x, cy - r * 1.15], [x + r * .9, cy - r * .35], [x + r * .75, cy + r * .6], [x, cy + r * .85], [x - r * .8, cy + r * .55], [x - r * .9, cy - r * .3]];
  poly(ctx, pts, c);
  poly(ctx, [[x, cy - r * 1.15], [x + r * .9, cy - r * .35], [x + r * .1, cy]], shade(c, -.06));
  poly(ctx, [[x + r * .1, cy], [x + r * .9, cy - r * .35], [x + r * .75, cy + r * .6], [x, cy + r * .85]], shade(c, -.14));
  poly(ctx, [[x, cy - r * 1.15], [x - r * .9, cy - r * .3], [x - r * .2, cy - r * .1]], shade(c, .1));
}
function mixedTitle(ctx, latin, cn, x, y, size, color) {
  ctx.font = `900 ${size}px ${FD}`; const w1 = ctx.measureText(latin).width; const w2 = ctx.measureText(cn).width;
  const x0 = x - (w1 + w2) / 2;
  text(ctx, latin, x0, y, { size, font: FD, weight: 900, align: 'left', color });

function bubble(ctx, x, y, s, o = {}) {
  usedText.add(s);
  const size = o.size || 40, pad = size * .6;
  ctx.font = `${o.weight || 500} ${size}px ${o.font || FB}`;
  const w = ctx.measureText(s).width + pad * 2, h = size + pad * 1.15;

    poly(ctx, [[tx - 14, -2], [tx + (o.tailDir || 0) * 16 - 4, 24], [tx + 14, -2]], fill);

  const a = o.alpha ?? 1; if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;

  ctx.restore();
  bubble(ctx, x, y, s, { ...o, tail: false });
}

/* ---------- faceted characters ---------- */
const BODY = {
  kid:   { hw: 116, hh: 122, bh: 96,  sw: 92,  hem: 106, lh: 50, arm: 70, coat: false },
  teen:  { hw: 106, hh: 120, bh: 128, sw: 100, hem: 116, lh: 70, arm: 88, coat: false },

  if (document.activeElement !== scrub) scrub.value = Math.round(cur / DURATION * 1000);
  const sc = sceneAt(cur); rail.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.id === 'ch' + sc.idx));
}
playBtn.addEventListener('click', () => playing ? pause() : play());
bigPlay.addEventListener('click', play);
scrub.addEventListener('input', () => seek(scrub.value / 1000 * DURATION));
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? '取消静音' : '静音'; muteBtn.setAttribute('aria-pressed', String(muted)); if (gainNode) gainNode.gain.value = muted ? 0 : 1; });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return; if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } if (e.code === 'ArrowRight') seek(cur + 5); if (e.code === 'ArrowLeft') seek(cur - 5); });
window.addEventListener('resize', () => { sizeCanvas(); draw(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
draw();
})();
</script>
