/* ---------- characters ---------- */
const AGE = {
  kid:   { hr: 74, bh: 92,  lh: 58,  bw: 94,  arm: 70, lw: 22, aw: 18 },
  teen:  { hr: 68, bh: 125, lh: 92,  bw: 98,  arm: 86, lw: 22, aw: 19 },
  adult: { hr: 66, bh: 140, lh: 108, bw: 106, arm: 94, lw: 24, aw: 20 },
  old:   { hr: 66, bh: 132, lh: 100, bw: 110, arm: 90, lw: 24, aw: 20 },

function person(ctx, o) {

  ctx.save(); ctx.translate(hcx, hcy); ctx.rotate(o.tilt || 0);

function header(ctx, sc, lt) {

function moodAt(t) {

/* ---------- fonts: pre-pass collects every string, then loads only the glyph subsets needed ---------- */

/* ---------- player ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

const POSTER_T = 3.6;

const $ = id => document.getElementById(id);

let fontsReady = false;
loadFonts().then(() => { fontsReady = true; draw(); });

// chapter rail
const rail = $('rail');
S.forEach(sc => { if (!sc.age) return; const li = document.createElement('li'); const b = document.createElement('button'); b.type = 'button'; b.id = 'ch' + sc.idx;
  b.innerHTML = `<span class="age">${sc.age}</span><span class="nm">${sc.title.split(' · ')[1]}</span>`; b.addEventListener('click', () => { seek(sc.start + .05); if (!playing) play(); }); li.appendChild(b); rail.appendChild(li); });

}
